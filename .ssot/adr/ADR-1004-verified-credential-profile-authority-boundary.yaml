body: |-
  ## Context
  
  W3C Verifiable Credentials Data Model defines a credential data model for interoperable claims made by issuers about subjects and presented to verifiers by holders. Profile-related credentials can carry identity attributes, subject identifiers, status information, validity periods, schemas, and proof material.
  
  ## Decision
  
  Verifiable credential source curation covers credential-bearing profile claims, credential subject data, issuer and holder context, verifier use, validity metadata, credential status, schema usage, and proof requirements. It does not replace OpenID Connect verified claims or SCIM provisioning semantics; it governs profile claims when those claims are represented as verifiable credentials.
  
  ## Authority Sources
  
  - W3C Verifiable Credentials Data Model.
