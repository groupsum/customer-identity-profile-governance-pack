body: |-
  ## Context
  
  CDP Institute materials define customer data platform concepts around persistent, unified, accessible customer profiles. Schema.org Person defines public linked-data properties for people and organizations publishing person-like profile data.
  
  ## Decision
  
  CDP source curation covers persistent customer profile concepts, profile unification, profile accessibility, and customer identity data usage at the customer data platform level. Schema.org Person source curation covers public linked-data person semantics and must remain distinct from private provisioning, authentication, assurance, and credential authorities.
  
  ## Authority Sources
  
  - CDP Institute CDP definition and basics materials.
  - Schema.org Person.
