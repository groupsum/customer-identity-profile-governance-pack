body: |-
  ## Purpose
  
  Define pack-local requirements for curating SCIM customer profile provisioning targets.
  
  ## Requirements
  
  - SCIM targets MUST be sourced from RFC 7643, RFC 7644, or the IANA SCIM Schema URI Registry.
  - SCIM schema targets MUST identify whether they govern User resources, Group resources, enterprise extensions, common attributes, attribute characteristics, or extension schema identifiers.
  - SCIM protocol targets MUST identify whether they govern create, read, update, delete, query, filtering, pagination, bulk, patch, service provider configuration, resource type discovery, or schema discovery behavior.
  - SCIM schema URI targets MUST preserve registered URI identity and registry authority.
  - SCIM targets MUST NOT imply OpenID Connect authentication claim behavior, OpenID assurance evidence behavior, W3C verifiable credential proof behavior, or CDP profile unification behavior.
  
  ## Authority Sources
  
  - RFC 7643, System for Cross-domain Identity Management: Core Schema.
  - RFC 7644, System for Cross-domain Identity Management: Protocol.
  - IANA SCIM Schema URI Registry.
