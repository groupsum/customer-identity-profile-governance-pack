body: |-
  ## Purpose
  
  Define pack-local requirements for curating verifiable credential profile targets and shared identity signal targets.
  
  ## Requirements
  
  - Verifiable credential profile targets MUST identify credential subject, issuer, holder or presenter, verifier, claim data, validity metadata, status metadata, schema usage, and proof requirements where applicable.
  - Verifiable credential profile targets MUST remain separate from OpenID identity assurance verified claims unless an explicit mapping target is curated.
  - Shared identity signal targets MUST identify subject representation, event semantics, issuer context, and delivery or evaluation semantics where the source defines them.
  - Signal targets MUST NOT be curated as persistent profile attributes unless the target explicitly describes how the signal changes or qualifies profile trust.
  
  ## Authority Sources
  
  - W3C Verifiable Credentials Data Model.
  - OpenID Shared Signals Framework.
