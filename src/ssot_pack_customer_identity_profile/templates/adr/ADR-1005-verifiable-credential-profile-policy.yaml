{
  "id": "adr:verifiable-credential-profile-policy",
  "number": 1005,
  "slug": "verifiable-credential-profile-policy",
  "title": "Verifiable Credential Profile Policy",
  "status": "accepted",
  "supersedes": [],
  "superseded_by": [],
  "context": [
    "Verifiable credentials can carry profile claims made by issuers about credential subjects and presented for verification.",
    "Credential-based claims are governed by issuer, subject, holder, verifier, status, schema, validity, and proof semantics."
  ],
  "decision": [
    "Use the W3C Verifiable Credentials Data Model when profile claims are accepted or emitted as verifiable credentials.",
    "Retain credential issuer, credential subject, status, schema, validity, and proof context for profile claims represented by credentials."
  ],
  "authority_sources": [
    "W3C Verifiable Credentials Data Model"
  ],
  "consequences": [
    "Credential-backed profile attributes require evidence handling that is distinct from SCIM, OpenID Connect, and CDP profile records.",
    "Downstream systems should test credential validity, status, schema, and proof handling before relying on credential claims."
  ]
}
